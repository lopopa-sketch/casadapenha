<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa da Penha · Estoril</title>
<link rel="alternate" hreflang="pt" href="https://casadapenha.pt/">
<link rel="alternate" hreflang="en" href="https://casadapenha.pt/index.en.html">
<meta name="description" content="Casa da Penha — a traditional Portuguese house in the centre of Estoril, a short walk from the sea, Casino Estoril, golf and tennis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<div class="grain"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="#top" class="brand" aria-label="Casa da Penha">
      <img src="images/logo-light.png" alt="Casa da Penha" class="logo logo-light">
      <img src="images/logo.png" alt="Casa da Penha" class="logo logo-dark">
    </a>
    <nav class="main-nav">
      <a href="#casa">The House</a>
      <a href="#quartos">Rooms</a>
      <a href="#comodidades">Amenities</a>
      <a href="#jardim">Garden</a>
      <a href="#localizacao">Location</a>
      <a href="#contacto">Contact</a>
      <a href="reservar.en.html" class="nav-cta">Book</a>
      <a href="index.html" class="lang-switch" hreflang="pt" lang="pt" aria-label="Versão em português">PT</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="mobile-nav" id="mobileNav">
  <a href="#casa">The House</a>
  <a href="#quartos">Rooms</a>
  <a href="#comodidades">Amenities</a>
  <a href="#jardim">Garden</a>
  <a href="#localizacao">Location</a>
  <a href="#contacto">Contact</a>
  <a href="reservar.en.html">Book</a>
  <a href="index.html" hreflang="pt" lang="pt">Português</a>
</div>

<main id="top">

  <section class="hero" id="hero">
    <img src="images/hero.jpg" alt="Casa da Penha, façade and garden" class="hero-img" id="heroImg">
    <div class="hero-overlay"></div>
    <div class="hero-content" id="heroContent"></div>
  </section>

  <section class="intro" id="casa">
    <div class="intro-inner" id="introInner"></div>
  </section>

  <section class="strip" id="stripContainer"></section>

  <section class="rooms" id="quartos">
    <div class="section-head" id="roomsSectionHead"></div>
    <div id="roomBlocks"></div>
    <div class="bath-strip" id="bathStrip"></div>
  </section>

  <section class="amenities" id="comodidades">
    <div class="section-head" id="amenitiesSectionHead"></div>
    <div class="amenities-grid" id="amenitiesGrid"></div>
  </section>

  <section class="garden" id="jardim">
    <img src="images/garden-wide.jpg" alt="Casa da Penha garden with deck and pine trees" class="garden-bg" id="gardenBg" loading="lazy">
    <div class="garden-overlay"></div>
    <div class="garden-content" id="gardenContent"></div>
    <div class="garden-gallery" id="gardenGallery"></div>
  </section>

  <section class="location" id="localizacao">
    <div class="section-head" id="locationSectionHead"></div>
    <div class="location-inner">
      <div class="location-text" id="locationText"></div>
      <div class="location-list" id="locationList"></div>
    </div>
  </section>

  <section class="contact" id="contacto">
    <div class="contact-inner" id="contactInner"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <img src="images/logo-light.png" alt="Casa da Penha" class="footer-logo">
    <span class="footer-loc" id="footerLoc">Estoril · Cascais Line · Portugal</span>
  </div>
  <div class="footer-badge">
    <a href="https://boutiquehotel.me/estoril/" target="_blank" rel="noopener">
      <img src="https://static.boutiquehotel.me/logo/boutique-top-dark.png" alt="Top rated by Boutiquehotel.me" loading="lazy">
    </a>
    <a href="https://www.livroreclamacoes.pt/Inicio/" target="_blank" rel="noopener" class="complaints-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4.5C4 3.67 4.67 3 5.5 3H16a2 2 0 012 2v14a2 2 0 01-2 2H5.5a1.5 1.5 0 01-1.5-1.5v-15z"/><path d="M4 17.5C4 16.67 4.67 16 5.5 16H18"/><path d="M8 7h6M8 10h6"/></svg>
      <span>Complaints Book (Livro de Reclamações)</span>
    </a>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
